suite: Test argocd resource configuration
templates:
  - templates/plumbing/argocd.yaml
release:
  name: release-test
tests:
  - it: should render default applicationSet resources
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.applicationSet
          content:
            resources:
              limits:
                cpu: "2"
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi

  - it: should render default controller resources
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.controller
          content:
            resources:
              limits:
                cpu: "4"
                memory: 4Gi
              requests:
                cpu: 500m
                memory: 2Gi

  - it: should render default dex resources
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.sso.dex
          content:
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 250m
                memory: 128Mi

  - it: should render default repo resources
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.repo
          content:
            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 256Mi

  - it: should render default server resources
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.server
          content:
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 125m
                memory: 128Mi

  - it: should allow overriding controller resources
    set:
      clusterGroup:
        argoCD:
          resources:
            controller:
              limits:
                cpu: "8"
                memory: 16Gi
              requests:
                cpu: "2"
                memory: 8Gi
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.controller
          content:
            resources:
              limits:
                cpu: "8"
                memory: 16Gi
              requests:
                cpu: "2"
                memory: 8Gi

  - it: should allow overriding server resources
    set:
      clusterGroup:
        argoCD:
          resources:
            server:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 256Mi
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.server
          content:
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 256Mi

  - it: should allow overriding applicationSet resources
    set:
      clusterGroup:
        argoCD:
          resources:
            applicationSet:
              limits:
                cpu: "4"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 1Gi
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.applicationSet
          content:
            resources:
              limits:
                cpu: "4"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 1Gi

  - it: should allow overriding repo resources
    set:
      clusterGroup:
        argoCD:
          resources:
            repo:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 512Mi
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.repo
          content:
            resources:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: 500m
                memory: 512Mi

  - it: should allow overriding dex resources
    set:
      clusterGroup:
        argoCD:
          resources:
            dex:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 500m
                memory: 256Mi
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.sso.dex
          content:
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 500m
                memory: 256Mi

  - it: should allow overriding multiple component resources at once
    set:
      clusterGroup:
        argoCD:
          resources:
            controller:
              limits:
                cpu: "8"
                memory: 16Gi
              requests:
                cpu: "2"
                memory: 8Gi
            server:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 256Mi
    documentIndex: 0
    asserts:
      - isSubset:
          path: spec.controller
          content:
            resources:
              limits:
                cpu: "8"
                memory: 16Gi
              requests:
                cpu: "2"
                memory: 8Gi
      - isSubset:
          path: spec.server
          content:
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 256Mi
      - isSubset:
          path: spec.applicationSet
          content:
            resources:
              limits:
                cpu: "2"
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
      - isSubset:
          path: spec.repo
          content:
            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 256Mi
      - isSubset:
          path: spec.sso.dex
          content:
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 250m
                memory: 128Mi

  - it: should not render argocd when singleArgoCD is true
    set:
      global:
        singleArgoCD: true
    asserts:
      - hasDocuments:
          count: 0
